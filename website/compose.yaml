# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  app:
    container_name: jsdale-takes-photos
    image: jsdale-takes-photos-app
    build:
      context: .
    environment:
      NODE_ENV: pub
      KEY: pub
    restart: unless-stopped

  # Dials out to Cloudflare so the app is reachable without forwarding a port
  # on the router. Create the tunnel and its public hostname (pointing at
  # http://app:3000) in the Cloudflare Zero Trust dashboard, then put the
  # token it gives you into a .env file next to this compose.yaml as
  # TUNNEL_TOKEN=... (see readme.md).
  cloudflared:
    container_name: jsdale-takes-photos-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - app
